name: Inspect W10 Flow Agent
on:
  push:
    branches: [design/w10-flow-video-scroll]
    paths: ['.github/workflows/inspect-w10-flow-agent.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, mainbuyer-server2]
    timeout-minutes: 5
    steps:
      - name: Inspect current video source handling
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$HOME/agents/w10-flow-video-scroll/preview/video"
          echo '=== index video block ==='
          grep -n -A12 -B5 '<video' "$ROOT/index.html" || true
          echo '=== app source and readiness lines ==='
          grep -n -E -A8 -B8 'canPlay|data-src|startVideo|loadeddata|loadedmetadata|querySelector.*source|failToStatic' "$ROOT/app.js" || true
          echo '=== video canplay diagnostic in headless chromium ==='
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          cd "$HOME/agents/flow-browser-automation"
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true}); const p=await b.newPage(); console.log(await p.evaluate(()=>({mp4:document.createElement('video').canPlayType('video/mp4; codecs="avc1.42E01E"'),webm:document.createElement('video').canPlayType('video/webm; codecs="vp8"'),vp9:document.createElement('video').canPlayType('video/webm; codecs="vp9"')}))); await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS
