name: Inspect W10 Flow Agent
on:
  push:
    branches: [design/w10-flow-video-scroll]
    paths: ['.github/workflows/inspect-w10-flow-agent.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, Linux, mainbuyer-server2]
    timeout-minutes: 5
    steps:
      - name: Inspect live agent state without modifying it
        shell: bash
        run: |
          set -euo pipefail
          echo '=== processes ==='
          ps -eo pid,etimes,cmd | grep -E '[c]laude|[c]odex|[a]gy-safe|[a]gy -p' || true
          echo '=== work files ==='
          find "$HOME/agents/w10-flow-video-scroll/preview/video" -maxdepth 2 -type f -printf '%p %s bytes\n' 2>/dev/null | sort || true
          echo '=== reports ==='
          ls -l "$HOME/agents/w10-flow-video-scroll"/*VIDEO*REPORT*.md "$HOME/agents/w10-flow-video-scroll"/*VIDEO*REVIEW*.md 2>/dev/null || true
          echo '=== claude output tail ==='
          tail -80 /tmp/w10-claude-video-output.txt 2>/dev/null || true
          echo '=== video probe ==='
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 "$HOME/agents/flow-browser-automation/artifacts/w10-flow-video/knowledge-constellation.mp4" 2>/dev/null || true
