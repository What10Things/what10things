name: Patch W10 R01 travel quality

on:
  push:
    branches: [automation/n8n-knowledge-factory]
    paths: ['.github/workflows/patch-r01-quality.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/n8n-knowledge-factory
          fetch-depth: 0
      - name: Tighten travel quality gates
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('automation/n8n/W10-R01-evidence-research.json')
          data=json.loads(path.read_text())
          w=data[0]
          nodes={n['name']:n for n in w['nodes']}

          p=nodes['Build evidence-grounded research prompt']['parameters']['jsCode']
          old="Prefer durable attractions over temporary events. Do not state current prices or opening hours unless the supplied evidence clearly dates them."
          new=("Use durable places and attractions only: exclude festivals, one-off events, seasonal celebrations and other date-dependent experiences from an evergreen things-to-do guide. "
               "Geography must be exact: if an item title names a city, region or island, the body and cited evidence must place the attraction in that same location. Never guess a location. "
               "Avoid wording such as currently, today, ongoing, continues today or still under construction. Do not make best/highest/largest/oldest/most-popular or similar superlative claims unless that exact claim is explicitly supported by a cited source. "
               "Do not state current prices or opening hours unless the supplied evidence clearly dates them.")
          assert old in p, 'travel prompt anchor not found'
          p=p.replace(old,new)
          p=p.replace('/* W10_R01_PROMPT_V5_ROUTER */','/* W10_R01_PROMPT_V6_TRAVEL_QUALITY */')
          nodes['Build evidence-grounded research prompt']['parameters']['jsCode']=p

          v=nodes['Validate ten sourced facts']['parameters']['jsCode']
          anchor="if(title.length<5||body.length<40||!ids.length)continue;"
          guard=r'''if(title.length<5||body.length<40||!ids.length)continue;
if(String(c.category)==='travel'){
  const joined=(title+' '+body);
  if(/\b(currently|today|ongoing|continues today|still under construction)\b/i.test(joined))continue;
  if(String(c.intent||base.intent)==='things_to_do'&&/\b(festival|festivities|annual event|seasonal celebration|one-off event)\b/i.test(joined))continue;
  const titleLoc=title.match(/\bin\s+([A-ZÀ-ÖØ-Þ][A-Za-zÀ-ÖØ-öø-ÿ .'-]{2,40})$/u);
  const lead=body.slice(0,240);
  const bodyLoc=lead.match(/\b(?:located|situated|based|set|complex)\s+(?:on|in|near)\s+(?:the\s+)?([A-ZÀ-ÖØ-Þ][A-Za-zÀ-ÖØ-öø-ÿ .'-]{2,40}?)(?=[,.;]|\sis\b|\sand\b)/u)||lead.match(/\bin\s+([A-ZÀ-ÖØ-Þ][A-Za-zÀ-ÖØ-öø-ÿ'-]{2,30})(?=[,.;])/u);
  if(titleLoc&&bodyLoc){const norm=s=>String(s||'').toLowerCase().replace(/[^a-zà-öø-ÿ]+/g,' ').trim();if(norm(titleLoc[1])!==norm(bodyLoc[1]))continue;}
  const risky=body.match(/\b(highest|lowest|largest|smallest|oldest|newest|best|most visited|most popular)\b/i);
  if(risky){const needle=String(risky[1]).toLowerCase();const support=ids.map(id=>String(byId.get(id)?.content||'').toLowerCase()).join(' ');if(!support.includes(needle))continue;}
}'''
          assert anchor in v, 'validator anchor not found'
          v=v.replace(anchor,guard,1)
          v=v.replace('/* W10_R01_VALIDATE_V5 */','/* W10_R01_VALIDATE_V6_TRAVEL_QUALITY */')
          nodes['Validate ten sourced facts']['parameters']['jsCode']=v

          path.write_text(json.dumps(data,separators=(',',':'),ensure_ascii=False)+'\n')
          # Structural sanity.
          check=json.loads(path.read_text())[0]
          assert check['active'] is False
          assert len(check['nodes']) >= 10
          print('Patched R01 travel quality gates')
          PY
          git config user.name 'What10Things Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add automation/n8n/W10-R01-evidence-research.json
          git commit -m 'Tighten travel research quality gates'
          git push origin HEAD:automation/n8n-knowledge-factory
