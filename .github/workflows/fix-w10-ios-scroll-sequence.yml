name: Fix W10 iOS Scroll Sequence

on:
  push:
    branches: [design/w10-flow-video-scroll]
    paths: ['.github/workflows/fix-w10-ios-scroll-sequence.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-deploy:
    runs-on: [self-hosted, Linux, mainbuyer-server2]
    timeout-minutes: 25
    env:
      FLOW_ROOT: /home/ubuntu/agents/flow-browser-automation
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract iPhone frame sequence from existing Flow video
        shell: bash
        run: |
          set -euo pipefail
          SRC="preview/video/media/knowledge-constellation.mp4"
          OUT="preview/video/media/frames"
          test -s "$SRC"
          rm -rf "$OUT"
          mkdir -p "$OUT"
          ffmpeg -hide_banner -loglevel error -y -i "$SRC" -an -vf "fps=12,scale=768:-2:flags=lanczos" -c:v libwebp -quality 72 -compression_level 6 -preset picture "$OUT/frame-%03d.webp"
          COUNT=$(find "$OUT" -maxdepth 1 -type f -name 'frame-*.webp' | wc -l)
          BYTES=$(du -sb "$OUT" | awk '{print $1}')
          echo "FRAME_COUNT=$COUNT FRAME_BYTES=$BYTES"
          test "$COUNT" -ge 95
          if [ "$BYTES" -gt 6000000 ]; then
            rm -rf "$OUT"
            mkdir -p "$OUT"
            ffmpeg -hide_banner -loglevel error -y -i "$SRC" -an -vf "fps=12,scale=640:-2:flags=lanczos" -c:v libwebp -quality 66 -compression_level 6 -preset picture "$OUT/frame-%03d.webp"
          fi
          test -s "$OUT/frame-001.webp"
          test -s "$OUT/frame-096.webp"
          du -sh "$OUT"

      - name: Patch Apple touch devices to use frame scrubbing
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/w10_ios_scroll_patch.py "$GITHUB_WORKSPACE"
          git checkout -- .github/workflows/deploy-w10-flow-video-preview.yml
          node --check preview/video/app.js
          grep -q "mode === 'frames'" preview/video/app.js
          grep -q 'is-frame-mode' preview/video/style.css
          grep -q 'image/webp' preview/video/.htaccess

      - name: Local QA iPhone frames desktop video and reduced motion
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="$FLOW_ROOT/node_modules"
          pkill -f 'w10_range_server.js.*8794' >/dev/null 2>&1 || true
          nohup node .github/scripts/w10_range_server.js "$GITHUB_WORKSPACE/preview/video" 8794 >/tmp/w10-ios-range.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8794/ -o /tmp/w10-ios-local.html
          grep -q 'W10_FLOW_VIDEO_SCROLL_PREVIEW' /tmp/w10-ios-local.html
          node .github/scripts/w10_scroll_qa.js http://127.0.0.1:8794/

      - name: Commit tested iPhone compatibility files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'w10-ios-scroll-agent'
          git config user.email 'actions@what10things.local'
          git add preview/video
          git commit -m 'Use frame sequence for reliable iPhone scroll animation'
          git push origin HEAD:design/w10-flow-video-scroll

      - name: Deploy corrected isolated preview
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: mainbuyer.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./preview/video/
          server-dir: ./w10-video-preview/
          state-name: .ftp-deploy-w10-video-preview-state.json
          dangerous-clean-slate: false

      - name: Verify public iPhone frames
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            if curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://what10things.co.uk/w10-video-preview/?iosfix=${GITHUB_RUN_ID}" -o /tmp/w10-ios-public.html && grep -q 'W10_FLOW_VIDEO_SCROLL_PREVIEW' /tmp/w10-ios-public.html; then
              curl -fsSI --max-time 25 "https://what10things.co.uk/w10-video-preview/media/frames/frame-001.webp?v=${GITHUB_RUN_ID}" | grep -Ei 'HTTP/|content-type|content-length'
              break
            fi
            sleep 5
          done
          grep -q 'W10_FLOW_VIDEO_SCROLL_PREVIEW' /tmp/w10-ios-public.html
          export NODE_PATH="$FLOW_ROOT/node_modules"
          node .github/scripts/w10_scroll_qa.js https://what10things.co.uk/w10-video-preview/

      - name: Confirm billing guard
        if: always()
        shell: bash
        run: python3 "$FLOW_ROOT/bin/enforce-antigravity-overage.py"
