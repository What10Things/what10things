name: Patch R01 source diversity

# One-shot source-control patch for R01 evidence diversity + graph quality.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-r01-source-diversity.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch R01
        run: python3 automation/scripts/patch_r01_source_diversity.py
      - name: Commit patched workflow
        shell: bash
        run: |
          git diff --check
          git config user.name 'What10Things Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add automation/n8n/W10-R01-evidence-research.json
          git commit -m 'Tighten travel graph expansion quality'
          git push origin HEAD:main
