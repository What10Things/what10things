name: Finish W10 Flow Video Preview

on:
  push:
    branches: [design/w10-flow-video-scroll]
    paths: ['.github/workflows/finish-w10-flow-video-preview.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-push:
    runs-on: [self-hosted, Linux, mainbuyer-server2]
    timeout-minutes: 15
    env:
      WORK: /home/ubuntu/agents/w10-flow-video-scroll
      FLOW_ROOT: /home/ubuntu/agents/flow-browser-automation
      TARGET_BRANCH: design/w10-flow-video-scroll
    steps:
      - name: Validate preserved agent output and cross-browser media
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.local/node24/bin:$PATH"
          for f in index.html style.css app.js CLAUDE_VIDEO_REPORT.md CODEX_VIDEO_REVIEW.md media/knowledge-constellation.mp4 media/knowledge-constellation-scroll.webm; do test -s "$WORK/preview/video/$f"; done
          grep -q 'knowledge-constellation-scroll.webm' "$WORK/preview/video/index.html"
          grep -q 'canPlayVideo' "$WORK/preview/video/app.js"
          grep -q 'video/webm' "$WORK/preview/video/.htaccess"
          rm -f "$WORK/preview/video/index.html.orig"
          node --check "$WORK/preview/video/app.js"
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 "$WORK/preview/video/media/knowledge-constellation-scroll.webm"

      - name: Prove forward and reverse scrubbing using HTTP byte ranges
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          cat > /tmp/w10-range-server.js <<'JS'
          const http=require('http'),fs=require('fs'),path=require('path');
          const root=path.resolve(process.argv[2]); const port=Number(process.argv[3]||8792);
          const types={'.html':'text/html; charset=utf-8','.js':'application/javascript; charset=utf-8','.css':'text/css; charset=utf-8','.webm':'video/webm','.mp4':'video/mp4','.jpg':'image/jpeg','.png':'image/png'};
          http.createServer((req,res)=>{try{let u=new URL(req.url,'http://localhost').pathname; if(u.endsWith('/'))u+='index.html'; const f=path.resolve(root,'.'+decodeURIComponent(u)); if(!f.startsWith(root+path.sep)){res.writeHead(403);return res.end();} const st=fs.statSync(f); if(!st.isFile()){res.writeHead(404);return res.end();} const type=types[path.extname(f).toLowerCase()]||'application/octet-stream'; res.setHeader('Content-Type',type); res.setHeader('Accept-Ranges','bytes'); const r=req.headers.range; if(r){const m=/bytes=(\d*)-(\d*)/.exec(r); if(!m){res.writeHead(416);return res.end();} let start=m[1]?Number(m[1]):0,end=m[2]?Number(m[2]):st.size-1; end=Math.min(end,st.size-1); if(start> end||start>=st.size){res.writeHead(416,{'Content-Range':`bytes */${st.size}`});return res.end();} res.writeHead(206,{'Content-Range':`bytes ${start}-${end}/${st.size}`,'Content-Length':end-start+1}); if(req.method==='HEAD')return res.end(); fs.createReadStream(f,{start,end}).pipe(res);} else {res.writeHead(200,{'Content-Length':st.size}); if(req.method==='HEAD')return res.end(); fs.createReadStream(f).pipe(res);}}catch(e){res.writeHead(404);res.end();}}).listen(port,'127.0.0.1',()=>console.log('range server',root,port));
          JS
          pkill -f '/tmp/w10-range-server.js' >/dev/null 2>&1 || true
          nohup node /tmp/w10-range-server.js "$WORK/preview/video" 8792 >/tmp/w10-range-server.log 2>&1 &
          sleep 2
          curl -fsS -H 'Range: bytes=1000-1999' -D /tmp/w10-range-headers.txt http://127.0.0.1:8792/media/knowledge-constellation-scroll.webm -o /tmp/w10-range-slice.bin
          grep -q '206 Partial Content' /tmp/w10-range-headers.txt
          test "$(stat -c%s /tmp/w10-range-slice.bin)" -eq 1000
          cd "$FLOW_ROOT"
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true});
            for(const [width,height] of [[390,844],[1440,1000]]){const p=await b.newPage({viewport:{width,height}});const errors=[];p.on('console',m=>{if(m.type()==='error')errors.push(m.text())});p.on('pageerror',e=>errors.push(e.message));await p.goto('http://127.0.0.1:8792/',{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>window.__W10_VIDEO_SCROLL__?.ready===true,null,{timeout:15000});const a=await p.evaluate(()=>{const v=document.querySelector('#video');return{mode:window.__W10_VIDEO_SCROLL__?.mode,d:v.duration,rs:v.readyState,src:v.currentSrc,seek:v.seekable.length?[v.seekable.start(0),v.seekable.end(0)]:[],overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+1}});await p.evaluate(()=>scrollTo(0,(document.documentElement.scrollHeight-innerHeight)*.72));await p.waitForTimeout(1800);const f=await p.evaluate(()=>({t:document.querySelector('#video').currentTime,p:window.__W10_SCROLL_PROGRESS__}));await p.evaluate(()=>scrollTo(0,(document.documentElement.scrollHeight-innerHeight)*.18));await p.waitForTimeout(1800);const r=await p.evaluate(()=>({t:document.querySelector('#video').currentTime,p:window.__W10_SCROLL_PROGRESS__}));console.log(JSON.stringify({width,a,f,r,errors}));if(a.mode!=='video'||a.d<7.5||a.rs<2||!a.src.includes('.webm')||!a.seek.length||a.seek[1]<7.5||a.overflow||errors.length||f.p<.3||f.t<=.5||r.p>=f.p||r.t>=f.t)process.exit(2);await p.close();}
            const rm=await b.newPage({viewport:{width:390,height:844},reducedMotion:'reduce'});const media=[];rm.on('request',x=>{if(/\.(mp4|webm)(\?|$)/.test(x.url()))media.push(x.url())});await rm.goto('http://127.0.0.1:8792/',{waitUntil:'domcontentloaded'});await rm.waitForTimeout(700);const s=await rm.evaluate(()=>({mode:window.__W10_VIDEO_SCROLL__?.mode,static:document.body.classList.contains('is-static'),video:getComputedStyle(document.querySelector('#video')).display,poster:getComputedStyle(document.querySelector('.stage-poster')).display}));console.log(JSON.stringify({reduced:s,media}));if(s.mode!=='static'||!s.static||s.video!=='none'||s.poster==='none'||media.length)process.exit(3);await rm.close();await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Commit tested preview and rebase onto latest branch
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/bin:$HOME/.local/node24/bin:$PATH"
          cd "$WORK"
          git config user.name 'w10-flow-agent-test'
          git config user.email 'actions@what10things.local'
          git add preview/video
          git commit -m 'Add tested Flow video scroll-scrub preview'
          git fetch origin "$TARGET_BRANCH"
          git rebase "origin/$TARGET_BRANCH"

      - name: Correct deployment QA and push preview
        shell: bash
        run: |
          set -euo pipefail
          cd "$WORK"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-w10-flow-video-preview.yml')
          s=p.read_text()
          s=s.replace("test -s preview/video/media/knowledge-constellation.mp4", "test -s preview/video/media/knowledge-constellation.mp4\n          test -s preview/video/media/knowledge-constellation-scroll.webm")
          s=s.replace("document.querySelector('#scrollVideo')", "document.querySelector('#video')")
          s=s.replace("document.querySelector('.motion-fallback')", "document.querySelector('.stage-poster')")
          p.write_text(s)
          PY
          git add .github/workflows/deploy-w10-flow-video-preview.yml
          git commit -m 'Update Flow video preview deployment selectors'
          git push origin "$TARGET_BRANCH"

      - name: Confirm billing guard
        if: always()
        shell: bash
        run: python3 "$FLOW_ROOT/bin/enforce-antigravity-overage.py"
