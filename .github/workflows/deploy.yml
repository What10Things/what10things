name: Deploy What 10 Things

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  statuses: write

concurrency:
  group: what10things-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Remove temporary diagnostic artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for artifact_id in 8612015792 8612056593; do
            curl --silent --show-error -L \
              -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${{ github.api_url }}/repos/${{ github.repository }}/actions/artifacts/${artifact_id}" \
              || true
          done

      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          payload=$(jq -nc \
            --arg state "pending" \
            --arg context "godaddy-deploy" \
            --arg description "Validation and deployment started" \
            --arg target_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "${payload}"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP
        shell: bash
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Validate content
        run: php tests/validate.php

      - name: Deploy to GoDaddy by FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: mainbuyer.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ./what10things.co.uk/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/tests/**
            README.md
            .editorconfig

      - name: Check live website
        shell: bash
        run: |
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --location --max-time 20 \
              https://what10things.co.uk/ \
              | grep -Fq "Ten clear things"; then
              echo "Live website check passed."
              exit 0
            fi
            sleep 10
          done
          echo "The files deployed, but the live domain did not return the rebuilt homepage."
          exit 1

      - name: Record deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          state="${JOB_STATUS}"
          description="Validation, deployment and live check succeeded"
          if [ "${state}" = "cancelled" ]; then
            state="error"
            description="Deployment run was cancelled"
          elif [ "${state}" != "success" ]; then
            state="failure"
            description="Validation, deployment or live check failed"
          fi
          payload=$(jq -nc \
            --arg state "${state}" \
            --arg context "godaddy-deploy" \
            --arg description "${description}" \
            --arg target_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "${payload}"
