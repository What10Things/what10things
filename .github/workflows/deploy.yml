name: Deploy What 10 Things

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: what10things-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          payload=$(jq -nc \
            --arg state "pending" \
            --arg context "godaddy-deploy" \
            --arg description "Validation and deployment started" \
            --arg target_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "${payload}"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP
        shell: bash
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Validate content
        run: php tests/validate.php

      - name: Deploy to GoDaddy by FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: mainbuyer.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ./what10things.co.uk/
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/tests/**
            README.md
            .editorconfig

      - name: Inspect deployed and public responses
        id: response_check
        shell: bash
        run: |
          report="${RUNNER_TEMP}/what10things-http.txt"
          : >"${report}"
          vhost_ok=false
          public_ok=false

          check_url() {
            label="$1"
            shift
            headers="${RUNNER_TEMP}/${label}.headers"
            body="${RUNNER_TEMP}/${label}.body"
            echo "=== ${label} ===" >>"${report}"
            set +e
            curl --silent --show-error --location --insecure --max-time 30 \
              --dump-header "${headers}" --output "${body}" \
              --write-out 'HTTP_CODE=%{http_code}\nREMOTE_IP=%{remote_ip}\nURL_EFFECTIVE=%{url_effective}\n' \
              "$@" >>"${report}" 2>&1
            code=$?
            set -e
            echo "CURL_EXIT_CODE=${code}" >>"${report}"
            sed -n '1,20p' "${headers}" >>"${report}" 2>/dev/null || true
            echo "--- BODY ---" >>"${report}"
            head -c 800 "${body}" >>"${report}" 2>/dev/null || true
            printf '\n\n' >>"${report}"
          }

          check_url direct_https \
            --resolve what10things.co.uk:443:216.69.174.69 \
            https://what10things.co.uk/
          if grep -Fq "Ten clear things" "${RUNNER_TEMP}/direct_https.body"; then
            vhost_ok=true
          fi

          check_url direct_http \
            --resolve what10things.co.uk:80:216.69.174.69 \
            http://what10things.co.uk/
          if grep -Fq "Ten clear things" "${RUNNER_TEMP}/direct_http.body"; then
            vhost_ok=true
          fi

          check_url public_https https://what10things.co.uk/
          if grep -Fq "Ten clear things" "${RUNNER_TEMP}/public_https.body"; then
            public_ok=true
          fi

          echo "vhost_ok=${vhost_ok}" >>"${GITHUB_OUTPUT}"
          echo "public_ok=${public_ok}" >>"${GITHUB_OUTPUT}"
          cat "${report}"

      - name: Upload HTTP diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: what10things-http-diagnostic
          path: ${{ runner.temp }}/what10things-http.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Require deployed GoDaddy virtual host
        if: steps.response_check.outputs.vhost_ok != 'true'
        shell: bash
        run: |
          echo "GoDaddy accepted the files but the virtual host did not return the rebuilt homepage."
          exit 1

      - name: Record deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          PUBLIC_OK: ${{ steps.response_check.outputs.public_ok }}
        shell: bash
        run: |
          deploy_state="${JOB_STATUS}"
          deploy_description="Validation and GoDaddy deployment succeeded"
          if [ "${deploy_state}" = "cancelled" ]; then
            deploy_state="error"
            deploy_description="Deployment run was cancelled"
          elif [ "${deploy_state}" != "success" ]; then
            deploy_state="failure"
            deploy_description="Validation, upload or GoDaddy vhost check failed"
          fi

          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          deploy_payload=$(jq -nc \
            --arg state "${deploy_state}" \
            --arg context "godaddy-deploy" \
            --arg description "${deploy_description}" \
            --arg target_url "${run_url}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "${deploy_payload}"

          public_state="failure"
          public_description="Public domain is not returning the deployed site"
          if [ "${PUBLIC_OK}" = "true" ]; then
            public_state="success"
            public_description="Public domain returns the deployed homepage"
          fi
          public_payload=$(jq -nc \
            --arg state "${public_state}" \
            --arg context "public-domain" \
            --arg description "${public_description}" \
            --arg target_url "${run_url}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "${public_payload}"
