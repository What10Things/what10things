name: Deploy What 10 Things to GoDaddy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: what10things-production
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check deployment secrets
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "${FTP_USERNAME}" || { echo "FTP_USERNAME is missing"; exit 1; }
          test -n "${FTP_PASSWORD}" || { echo "FTP_PASSWORD is missing"; exit 1; }

      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          payload=$(jq -nc \
            --arg state "pending" \
            --arg context "godaddy-deploy" \
            --arg description "Flask validation and deployment started" \
            --arg target_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "${payload}"

      - name: Reconstruct verified Flask application
        shell: bash
        run: |
          mkdir -p deploy
          cat deploy-package/part-* | base64 --decode > "${RUNNER_TEMP}/what10things-flask.zip"
          echo "328fb9ad85269f5f018f19b2040468f6ac7f4af4d6878d0f4f1a0f6ec2ce142f  ${RUNNER_TEMP}/what10things-flask.zip" | sha256sum --check --strict
          unzip -q "${RUNNER_TEMP}/what10things-flask.zip" -d deploy
          find deploy -type d -name '__pycache__' -prune -exec rm -rf {} +
          find deploy -type f -name '*.pyc' -delete
          mkdir -p deploy/tmp
          date -u +'%Y-%m-%dT%H:%M:%SZ' > deploy/tmp/restart.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: deploy/requirements.txt

      - name: Install and validate Flask application
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r deploy/requirements.txt
          PYTHONPATH=deploy python deploy/validate.py

      - name: Deploy to live Passenger application
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: mainbuyer.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          server-dir: ./flask_app/
          state-name: .ftp-deploy-what10things-flask-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/__pycache__/**
            **/*.pyc

      - name: Inspect remote Passenger paths
        if: always()
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          report="${RUNNER_TEMP}/what10things-passenger-diagnostic.txt"
          : > "${report}"
          lftp -c "
            set net:max-retries 1;
            set net:timeout 20;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            open -p 21 -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" mainbuyer.com;
            echo ROOT_DIRECTORY;
            pwd;
            cls -la;
            echo FLASK_APP_DIRECTORY;
            cls -la flask_app;
            echo FLASK_APP_TMP;
            cls -la flask_app/tmp;
            echo DOMAIN_DIRECTORY;
            cls -la what10things.co.uk;
            echo DOMAIN_TMP;
            cls -la what10things.co.uk/tmp;
            bye;
          " > "${report}" 2>&1 || true

          for remote in \
            flask_app/passenger_log \
            what10things.co.uk/passenger_log \
            passenger_log; do
            safe_name=$(echo "${remote}" | tr '/' '_')
            lftp -c "
              set net:max-retries 1;
              set net:timeout 20;
              set ftp:ssl-force true;
              set ftp:ssl-protect-data true;
              set ssl:verify-certificate no;
              open -p 21 -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" mainbuyer.com;
              get \"${remote}\" -o \"${RUNNER_TEMP}/${safe_name}\";
              bye;
            " >/dev/null 2>&1 || true
            if [ -f "${RUNNER_TEMP}/${safe_name}" ]; then
              echo "PASSENGER_LOG ${remote}" >> "${report}"
              tail -n 80 "${RUNNER_TEMP}/${safe_name}" >> "${report}" || true
            fi
          done
          cat "${report}"

      - name: Verify live Passenger routes
        id: live_check
        shell: bash
        run: |
          body="${RUNNER_TEMP}/live-homepage.html"
          headers="${RUNNER_TEMP}/live-homepage-headers.txt"

          check_route() {
            path="$1"
            expected="$2"
            curl --fail --silent --show-error --location --max-time 30 \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "https://what10things.co.uk${path}?deploy=${GITHUB_SHA}" \
              | grep -Fq "${expected}"
          }

          for attempt in $(seq 1 15); do
            if check_route "/" "Ten clear things" \
              && check_route "/guides/air-fryer-buying-guide" "Start with usable capacity" \
              && check_route "/travel/rome" "Rome"; then
              echo "What10Things is live on the Passenger application."
              exit 0
            fi
            echo "Passenger has not reloaded yet (attempt ${attempt}/15)."
            sleep 8
          done

          set +e
          curl --silent --show-error --location --max-time 30 \
            -H 'Cache-Control: no-cache' \
            -H 'Pragma: no-cache' \
            --dump-header "${headers}" \
            --output "${body}" \
            --write-out 'HTTP_CODE=%{http_code}\nREMOTE_IP=%{remote_ip}\nURL_EFFECTIVE=%{url_effective}\n' \
            "https://what10things.co.uk/?deploy=${GITHUB_SHA}"
          set -e
          echo '--- LIVE RESPONSE HEADERS ---'
          sed -n '1,40p' "${headers}" || true
          echo '--- LIVE RESPONSE BODY ---'
          head -c 2000 "${body}" || true
          echo
          echo "The upload completed, but the live Passenger routes still return the previous application or an application error."
          exit 1

      - name: Upload deployment diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: what10things-passenger-diagnostic
          path: |
            ${{ runner.temp }}/what10things-passenger-diagnostic.txt
            ${{ runner.temp }}/live-homepage-headers.txt
            ${{ runner.temp }}/live-homepage.html
          if-no-files-found: warn
          retention-days: 1

      - name: Record deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          state="${JOB_STATUS}"
          description="Flask app deployed to flask_app and verified live"
          if [ "${state}" = "cancelled" ]; then
            state="error"
            description="Deployment run was cancelled"
          elif [ "${state}" != "success" ]; then
            state="failure"
            description="Flask validation, FTPS upload or live check failed"
          fi
          payload=$(jq -nc \
            --arg state "${state}" \
            --arg context "godaddy-deploy" \
            --arg description "${description}" \
            --arg target_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "${payload}"
