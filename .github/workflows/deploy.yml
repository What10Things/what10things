name: Deploy What 10 Things

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: what10things-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          payload=$(jq -nc \
            --arg state "pending" \
            --arg context "godaddy-deploy" \
            --arg description "Validation and deployment started" \
            --arg target_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "${payload}"

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Lint PHP
        shell: bash
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Validate content
        run: php tests/validate.php

      - name: Install FTPS diagnostic client
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Check GoDaddy FTPS connection and directory
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        shell: bash
        run: |
          log="${RUNNER_TEMP}/godaddy-ftps.log"
          set +e
          lftp -c "
            set cmd:fail-exit yes;
            set net:max-retries 1;
            set net:timeout 20;
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            open -p 21 -u \"${FTP_USERNAME}\",\"${FTP_PASSWORD}\" \"${FTP_SERVER}\";
            echo CONNECTED;
            pwd;
            cd \"${FTP_SERVER_DIR}\";
            echo DIRECTORY_OK;
            pwd;
            cls -1;
            bye;
          " >"${log}" 2>&1
          code=$?
          printf '\nEXIT_CODE=%s\n' "${code}" >>"${log}"
          cat "${log}"
          exit "${code}"

      - name: Upload FTPS diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godaddy-ftps-diagnostic
          path: ${{ runner.temp }}/godaddy-ftps.log
          if-no-files-found: warn
          retention-days: 1

      - name: Deploy to GoDaddy by FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/tests/**
            README.md
            .editorconfig

      - name: Record deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          state="${JOB_STATUS}"
          description="Validation and GoDaddy deployment succeeded"
          if [ "${state}" = "cancelled" ]; then
            state="error"
            description="Deployment run was cancelled"
          elif [ "${state}" != "success" ]; then
            state="failure"
            description="Validation or GoDaddy deployment failed"
          fi
          payload=$(jq -nc \
            --arg state "${state}" \
            --arg context "godaddy-deploy" \
            --arg description "${description}" \
            --arg target_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "${payload}"
