name: Deploy What 10 Things to GoDaddy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: what10things-production
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check deployment secrets
        shell: bash
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          test -n "${FTP_USERNAME}" || { echo "FTP_USERNAME is missing"; exit 1; }
          test -n "${FTP_PASSWORD}" || { echo "FTP_PASSWORD is missing"; exit 1; }

      - name: Mark deployment pending
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          payload=$(jq -nc \
            --arg state "pending" \
            --arg context "godaddy-deploy" \
            --arg description "Flask validation and deployment started" \
            --arg target_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "${payload}"

      - name: Reconstruct base Flask application and overlay knowledge source
        shell: bash
        run: |
          rm -rf deploy
          mkdir -p deploy
          cat deploy-package/part-* | base64 --decode > "${RUNNER_TEMP}/what10things-flask.zip"
          echo "563746e61d46c82c60ffa7d8fb54c4d291471d7f42c8e2f305f9c094b25af78c  ${RUNNER_TEMP}/what10things-flask.zip" | sha256sum --check --strict
          unzip -q "${RUNNER_TEMP}/what10things-flask.zip" -d deploy
          cat flask-overlay/part-* | base64 --decode > "${RUNNER_TEMP}/what10things-knowledge-overlay.zip"
          echo "eb13d90d422dfbc74f48461cfefb40b54629ced80e4d037cc8a94fa84021cc67  ${RUNNER_TEMP}/what10things-knowledge-overlay.zip" | sha256sum --check --strict
          unzip -q -o "${RUNNER_TEMP}/what10things-knowledge-overlay.zip" -d deploy
          find deploy -type d -name '__pycache__' -prune -exec rm -rf {} +
          find deploy -type f -name '*.pyc' -delete
          rm -f deploy/runtime/knowledge.db deploy/runtime/knowledge.db-shm deploy/runtime/knowledge.db-wal
          mkdir -p deploy/tmp
          date -u +'%Y-%m-%dT%H:%M:%SZ' > deploy/tmp/restart.txt

          cat > deploy/.htaccess <<'HTACCESS'
          # DO NOT REMOVE. CLOUDLINUX PASSENGER CONFIGURATION BEGIN
          PassengerAppRoot "/home/uak0tydpqj02/public_html"
          PassengerBaseURI "/"
          PassengerPython "/home/uak0tydpqj02/virtualenv/flask_app/3.11/bin/python"
          PassengerAppLogFile "/home/uak0tydpqj02/passenger.log"
          # DO NOT REMOVE. CLOUDLINUX PASSENGER CONFIGURATION END
          HTACCESS

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: deploy/requirements.txt

      - name: Install and validate Flask application
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r deploy/requirements.txt
          PYTHONPATH=deploy python deploy/validate.py

      - name: Deploy to the What10Things document and Passenger root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: mainbuyer.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./deploy/
          server-dir: ./
          state-name: .ftp-deploy-what10things-public-html-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/__pycache__/**
            **/*.pyc
            **/runtime/*.db
            **/runtime/*.db-*

      - name: Verify live Passenger routes
        id: live_check
        shell: bash
        run: |
          fetch_route() {
            path="$1"
            curl --fail --silent --show-error --location --max-time 30 \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "https://what10things.co.uk${path}?deploy=${GITHUB_SHA}"
          }

          check_text() {
            path="$1"
            expected="$2"
            fetch_route "${path}" | grep -Fq "${expected}"
          }

          check_json_ok() {
            path="$1"
            fetch_route "${path}" | python3 -c 'import json,sys; data=json.load(sys.stdin); assert data.get("ok") is True'
          }

          for attempt in $(seq 1 20); do
            if check_text "/" "Ten clear things" \
              && check_text "/" "What10Things.co.uk is operated by Urban Sky Web Ltd." \
              && check_text "/topics" "Knowledge network" \
              && check_text "/methodology" "Map the evergreen subject" \
              && check_json_ok "/api/status" \
              && check_text "/about" "What10Things.co.uk is operated by Urban Sky Web Ltd." \
              && check_text "/privacy" "17421062" \
              && check_text "/affiliate-disclosure" "registered in England and Wales" \
              && check_text "/guides/air-fryer-buying-guide" "Start with usable capacity" \
              && check_text "/travel/rome" "Rome"; then
              echo "What10Things knowledge platform is live on Passenger."
              exit 0
            fi
            echo "Passenger has not reloaded yet (attempt ${attempt}/20)."
            sleep 8
          done

          echo "The deployment completed, but the live routes did not return the rebuilt application."
          exit 1

      - name: Record deployment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          state="${JOB_STATUS}"
          description="What10Things knowledge Flask app deployed and verified live"
          if [ "${state}" = "cancelled" ]; then
            state="error"
            description="Deployment run was cancelled"
          elif [ "${state}" != "success" ]; then
            state="failure"
            description="Flask validation, FTPS upload or live check failed"
          fi
          payload=$(jq -nc \
            --arg state "${state}" \
            --arg context "godaddy-deploy" \
            --arg description "${description}" \
            --arg target_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{state: $state, context: $context, description: $description, target_url: $target_url}')
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${{ github.api_url }}/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d "${payload}"
