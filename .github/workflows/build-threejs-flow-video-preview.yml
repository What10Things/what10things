name: Build Three.js Flow Video Preview

on:
  push:
    branches: [design/w10-threejs-video-texture]
    paths: ['.github/workflows/build-threejs-flow-video-preview.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: w10-threejs-flow-video-preview
  cancel-in-progress: true

jobs:
  build-review-test-deploy:
    runs-on: [self-hosted, Linux, mainbuyer-server2]
    timeout-minutes: 45
    env:
      FLOW_ROOT: /home/ubuntu/agents/flow-browser-automation
      PREVIEW_URL: https://what10things.co.uk/w10-threejs-preview/
      TOOLS: /tmp/w10-threejs-tools
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preflight source video and agents
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          python3 "$FLOW_ROOT/bin/enforce-antigravity-overage.py"
          test -s preview/video/media/knowledge-constellation.mp4
          test -s preview/video/media/frames/frame-001.webp
          test -s preview/video/media/frames/frame-096.webp
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 preview/video/media/knowledge-constellation.mp4
          claude --version
          codex --version
          "$HOME/.local/bin/agy-safe" --version
          node --version

      - name: Prepare exact Flow video media and build tools
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          rm -rf preview/threejs "$TOOLS"
          mkdir -p preview/threejs/media/frames preview/threejs/src "$TOOLS"
          cp preview/video/media/knowledge-constellation.mp4 preview/threejs/media/source-flow-video.mp4
          cp preview/video/media/knowledge-constellation-poster.jpg preview/threejs/media/source-poster.jpg
          cp preview/video/media/frames/frame-*.webp preview/threejs/media/frames/
          cd "$TOOLS"
          npm init -y >/dev/null 2>&1
          npm install --silent three esbuild
          test "$(find "$GITHUB_WORKSPACE/preview/threejs/media/frames" -name 'frame-*.webp' | wc -l)" -eq 96

      - name: Claude builds Three.js CanvasTexture implementation
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          cat > /tmp/w10-threejs-claude.txt <<'EOF'
          IMPLEMENT a complete static design preview in preview/threejs/. Do not return a plan. The user specifically requires the EXISTING Google Flow-generated 8-second video to remain the visual source.

          MEDIA SOURCE
          - preview/threejs/media/source-flow-video.mp4 is the exact Flow/Veo clip already generated.
          - preview/threejs/media/frames/frame-001.webp ... frame-096.webp are 12fps decoded frames from that exact clip. They are not replacement artwork.
          - Use those video-derived frames for the scroll-controlled visual. Do NOT generate a new scene instead of the video.
          - Include a small unobtrusive “Play original Flow clip” control that opens/plays source-flow-video.mp4 so the source can be independently checked.

          THREE.JS ARCHITECTURE
          - Create preview/threejs/index.html, style.css, src/main.js and .htaccess.
          - Import `three` as an npm module in src/main.js; workflow will bundle with esbuild. No CDN.
          - Create one hidden/offscreen 16:9 2D source canvas. Load the 96 WebP frames as Image objects. On scroll, draw the selected source frame into that canvas and mark a THREE.CanvasTexture needsUpdate=true.
          - Render that CanvasTexture on a Three.js plane as the main persistent visual. This is the critical requirement: the displayed visual must be the actual generated video frames.
          - Add restrained genuine 3D treatment around the video surface: camera depth/parallax, no more than ten small spatial nodes, a few orbit/relationship lines, subtle perspective shifts. Do not obscure the Flow footage or replace it with generic particles.
          - Scroll down must advance the source video frames; scroll up must reverse them. Use rAF smoothing but the final frame must deterministically correspond to scroll progress.
          - Mobile Safari must use the CanvasTexture path too; do not depend on HTMLVideoElement seeking for the scroll interaction.
          - The source MP4 may only be used by the explicit play-original control, not for scroll seeking.

          DESIGN
          - Premium dark editorial What10Things preview; keep the generated amber constellation footage dominant.
          - Sticky/full-viewport 3D stage with HTML text layered separately for legibility and SEO.
          - Make the 3D camera subtly move through the composition as chapters advance.
          - Mobile 390px portrait is first-class. No horizontal overflow. 44px controls. No hover dependency.
          - noindex,nofollow,noarchive and visible “Design preview · Three.js + Flow video” label.
          - Keep copy concise and truthful: explain this is an experiment using one generated Flow sequence as a scroll-driven knowledge surface, not a live production feature.

          PERFORMANCE / ACCESSIBILITY
          - Cap DPR (<=1.5 mobile, <=2 desktop), modest geometry, no post-processing.
          - Pause rendering when document.hidden.
          - prefers-reduced-motion or Save-Data: show the poster / first video-derived frame without loading all 96 frames and without continuous 3D animation.
          - Provide static fallback if WebGL fails.

          QA SURFACE
          Expose window.__W10_THREE__ with getters/fields at minimum: ready, mode, progress, frame, frameCount, source='flow-video-frames', signature, webgl. `signature` must be derived from sampled pixels of the same source canvas used by CanvasTexture, and update when the source frame changes. This is for automated proof that the actual displayed video texture changes.

          Add marker W10_THREEJS_FLOW_VIDEO_PREVIEW to the HTML. Write preview/threejs/CLAUDE_THREEJS_REPORT.md explaining the implementation and confirming the exact Flow video is the frame source. Run no deployment commands.
          EOF
          cat /tmp/w10-threejs-claude.txt | claude --print --allowedTools "Read,Glob,Grep,Edit,Write,Bash,Skill,Task,ToolSearch" | tee /tmp/w10-threejs-claude-output.txt
          test -s preview/threejs/index.html
          test -s preview/threejs/style.css
          test -s preview/threejs/src/main.js
          test -s preview/threejs/CLAUDE_THREEJS_REPORT.md
          grep -q 'W10_THREEJS_FLOW_VIDEO_PREVIEW' preview/threejs/index.html
          grep -q 'CanvasTexture' preview/threejs/src/main.js
          grep -q '__W10_THREE__' preview/threejs/src/main.js

      - name: Bundle and first Playwright proof
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          "$TOOLS/node_modules/.bin/esbuild" preview/threejs/src/main.js --bundle --minify --format=iife --outfile=preview/threejs/app.js --node-path="$TOOLS/node_modules"
          node --check preview/threejs/app.js
          pkill -f 'python3 -m http.server 8796' >/dev/null 2>&1 || true
          nohup python3 -m http.server 8796 --bind 127.0.0.1 --directory preview/threejs >/tmp/w10-threejs-server.log 2>&1 &
          sleep 2
          export NODE_PATH="$FLOW_ROOT/node_modules"
          cd "$FLOW_ROOT"
          node - <<'JS'
          const { chromium } = require('playwright'); const crypto=require('crypto');
          (async()=>{const b=await chromium.launch({headless:true});
            for(const cfg of [
              {w:390,h:844,ua:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1',mobile:true,touch:true},
              {w:1440,h:1000}
            ]){
              const p=await b.newPage({viewport:{width:cfg.w,height:cfg.h},userAgent:cfg.ua,isMobile:cfg.mobile,hasTouch:cfg.touch}); const errs=[];
              p.on('console',m=>{if(m.type()==='error')errs.push(m.text())}); p.on('pageerror',e=>errs.push(e.message));
              await p.goto('http://127.0.0.1:8796/',{waitUntil:'domcontentloaded'});
              await p.waitForFunction(()=>window.__W10_THREE__?.ready===true,null,{timeout:20000});
              const canvas=p.locator('#three-stage canvas');
              const a=await p.evaluate(()=>({frame:window.__W10_THREE__.frame,sig:window.__W10_THREE__.signature,src:window.__W10_THREE__.source,mode:window.__W10_THREE__.mode,webgl:window.__W10_THREE__.webgl,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+1}));
              const ah=crypto.createHash('sha256').update(await canvas.screenshot()).digest('hex');
              await p.evaluate(()=>scrollTo(0,(document.documentElement.scrollHeight-innerHeight)*.72)); await p.waitForTimeout(1200);
              const f=await p.evaluate(()=>({frame:window.__W10_THREE__.frame,sig:window.__W10_THREE__.signature,p:window.__W10_THREE__.progress}));
              const fh=crypto.createHash('sha256').update(await canvas.screenshot()).digest('hex');
              await p.evaluate(()=>scrollTo(0,(document.documentElement.scrollHeight-innerHeight)*.18)); await p.waitForTimeout(1200);
              const r=await p.evaluate(()=>({frame:window.__W10_THREE__.frame,sig:window.__W10_THREE__.signature,p:window.__W10_THREE__.progress}));
              const rh=crypto.createHash('sha256').update(await canvas.screenshot()).digest('hex');
              console.log(JSON.stringify({cfg,a,f,r,hashes:{ah,fh,rh},errs}));
              if(a.src!=='flow-video-frames'||!a.webgl||a.overflow||errs.length||f.frame<55||f.sig===a.sig||fh===ah||r.frame>=f.frame||r.sig===f.sig||rh===fh) process.exit(2);
              await p.close();
            }
            const rm=await b.newPage({viewport:{width:390,height:844},reducedMotion:'reduce'}); await rm.goto('http://127.0.0.1:8796/',{waitUntil:'domcontentloaded'}); await rm.waitForTimeout(700); const s=await rm.evaluate(()=>({mode:window.__W10_THREE__?.mode,frame:window.__W10_THREE__?.frame,rm:matchMedia('(prefers-reduced-motion: reduce)').matches})); console.log({reduced:s}); if(!s.rm||s.mode!=='static'||s.frame!==0)process.exit(3); await rm.close(); await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Antigravity independent architecture review
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          python3 "$FLOW_ROOT/bin/enforce-antigravity-overage.py"
          cat > /tmp/w10-agy-review.txt <<'EOF'
          Independently review this What10Things Three.js preview implementation. Read preview/threejs/index.html, style.css, src/main.js and CLAUDE_THREEJS_REPORT.md. The non-negotiable requirement is that the existing Flow-generated video remains the visual source: its 96 decoded WebP frames must be drawn into the same canvas used by THREE.CanvasTexture, and scroll must select those frames forward and backward. Three.js should add spatial depth around the footage, not replace it. Review mobile Safari suitability, memory/network behaviour for 96 frames (~2.6MB total), frame preloading strategy, CanvasTexture update correctness, reduced-motion/Save-Data behaviour, render-loop discipline, WebGL failure fallback, accessibility, and whether the 3D treatment is meaningful but restrained. Do not use Flow, do not change billing settings, do not modify files. Output a concise review ending with exactly VERDICT: PASS or VERDICT: REVISE.
          EOF
          cd "$GITHUB_WORKSPACE"
          timeout 480s "$HOME/.local/bin/agy-safe" -p "$(cat /tmp/w10-agy-review.txt)" --output-format text | tee preview/threejs/ANTIGRAVITY_THREEJS_REVIEW.md
          test -s preview/threejs/ANTIGRAVITY_THREEJS_REVIEW.md
          grep -Eq 'VERDICT: (PASS|REVISE)' preview/threejs/ANTIGRAVITY_THREEJS_REVIEW.md
          python3 "$FLOW_ROOT/bin/enforce-antigravity-overage.py"

      - name: Codex independently reviews and patches
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          cat > /tmp/w10-codex-threejs.txt <<'EOF'
          Review preview/threejs/ as a senior WebGL/mobile performance engineer. Claude built it and Antigravity independently reviewed it. Read index.html, style.css, src/main.js, CLAUDE_THREEJS_REPORT.md and ANTIGRAVITY_THREEJS_REVIEW.md. PATCH clear defects directly but preserve the key architecture: the exact existing Flow video is represented by 96 decoded frames; selected frame is drawn into a source canvas; that same canvas drives THREE.CanvasTexture; scrolling forward/reverse changes the displayed video-derived frame. Do not replace this with a synthetic Three.js scene and do not use HTMLVideoElement seeking for the scroll path. Preserve mobile Safari compatibility, reduced-motion/Save-Data fallback, noindex status and original-video playback control. Keep memory/GPU use conservative. Write preview/threejs/CODEX_THREEJS_REVIEW.md ending exactly VERDICT: PASS if fit for QA, otherwise VERDICT: FAIL. Run syntax checks as appropriate.
          EOF
          timeout 600s codex exec -C "$GITHUB_WORKSPACE" --approve-for-me "$(cat /tmp/w10-codex-threejs.txt)" | tee /tmp/w10-codex-threejs-output.txt
          test -s preview/threejs/CODEX_THREEJS_REVIEW.md
          grep -q '^VERDICT: PASS$' preview/threejs/CODEX_THREEJS_REVIEW.md
          "$TOOLS/node_modules/.bin/esbuild" preview/threejs/src/main.js --bundle --minify --format=iife --outfile=preview/threejs/app.js --node-path="$TOOLS/node_modules"
          node --check preview/threejs/app.js

      - name: Final local QA after agent reviews
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          export NODE_PATH="$FLOW_ROOT/node_modules"
          cd "$FLOW_ROOT"
          node - <<'JS'
          const {chromium}=require('playwright');
          (async()=>{const b=await chromium.launch({headless:true}); for(const [w,h] of [[390,844],[1440,1000]]){const p=await b.newPage({viewport:{width:w,height:h}});const e=[];p.on('console',m=>{if(m.type()==='error')e.push(m.text())});p.on('pageerror',x=>e.push(x.message));await p.goto('http://127.0.0.1:8796/',{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>window.__W10_THREE__?.ready);const s0=await p.evaluate(()=>({f:window.__W10_THREE__.frame,s:window.__W10_THREE__.signature,src:window.__W10_THREE__.source}));await p.evaluate(()=>scrollTo(0,(document.documentElement.scrollHeight-innerHeight)*.8));await p.waitForTimeout(1200);const s1=await p.evaluate(()=>({f:window.__W10_THREE__.frame,s:window.__W10_THREE__.signature,p:window.__W10_THREE__.progress}));await p.evaluate(()=>scrollTo(0,(document.documentElement.scrollHeight-innerHeight)*.1));await p.waitForTimeout(1200);const s2=await p.evaluate(()=>({f:window.__W10_THREE__.frame,s:window.__W10_THREE__.signature,p:window.__W10_THREE__.progress}));console.log({w,s0,s1,s2,e});if(s0.src!=='flow-video-frames'||s1.f<65||s1.s===s0.s||s2.f>=s1.f||s2.s===s1.s||e.length)process.exit(2);await p.close();}await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Commit tested isolated preview
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'w10-threejs-agent-test'
          git config user.email 'actions@what10things.local'
          git add preview/threejs
          git commit -m 'Add Three.js scroll surface using Flow video frames'
          git push origin HEAD:design/w10-threejs-video-texture

      - name: Deploy Three.js preview
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: mainbuyer.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./preview/threejs/
          server-dir: ./w10-threejs-preview/
          state-name: .ftp-deploy-w10-threejs-preview-state.json
          dangerous-clean-slate: false

      - name: Public browser proof
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          for i in $(seq 1 12); do curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "$PREVIEW_URL?v=${GITHUB_RUN_ID}" -o /tmp/w10-three-public.html && grep -q 'W10_THREEJS_FLOW_VIDEO_PREVIEW' /tmp/w10-three-public.html && break; sleep 5; done
          grep -q 'W10_THREEJS_FLOW_VIDEO_PREVIEW' /tmp/w10-three-public.html
          curl -fsSI --max-time 25 "$PREVIEW_URL/media/frames/frame-096.webp?v=${GITHUB_RUN_ID}" | grep -Ei 'HTTP/|content-type|content-length'
          export NODE_PATH="$FLOW_ROOT/node_modules"
          cd "$FLOW_ROOT"
          node - <<'JS'
          const {chromium}=require('playwright');(async()=>{const b=await chromium.launch({headless:true});const ua='Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1';const p=await b.newPage({viewport:{width:390,height:844},userAgent:ua,isMobile:true,hasTouch:true});const e=[];p.on('console',m=>{if(m.type()==='error')e.push(m.text())});p.on('pageerror',x=>e.push(x.message));await p.goto('https://what10things.co.uk/w10-threejs-preview/?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});await p.waitForFunction(()=>window.__W10_THREE__?.ready===true,null,{timeout:20000});const a=await p.evaluate(()=>({f:window.__W10_THREE__.frame,s:window.__W10_THREE__.signature,src:window.__W10_THREE__.source}));await p.evaluate(()=>scrollTo(0,(document.documentElement.scrollHeight-innerHeight)*.75));await p.waitForTimeout(1400);const f=await p.evaluate(()=>({f:window.__W10_THREE__.frame,s:window.__W10_THREE__.signature,p:window.__W10_THREE__.progress}));console.log({a,f,e});if(a.src!=='flow-video-frames'||f.f<55||f.s===a.s||e.length)process.exit(2);await p.close();await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Confirm Antigravity billing guard
        if: always()
        shell: bash
        run: python3 "$FLOW_ROOT/bin/enforce-antigravity-overage.py"
