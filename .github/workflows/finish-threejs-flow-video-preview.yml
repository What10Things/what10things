name: Finish Three.js Flow Video Preview

on:
  push:
    branches: [design/w10-threejs-video-texture]
    paths: ['.github/workflows/finish-threejs-flow-video-preview.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finish:
    runs-on: [self-hosted, Linux, mainbuyer-server2]
    timeout-minutes: 25
    env:
      FLOW_ROOT: /home/ubuntu/agents/flow-browser-automation
      TOOLS: /tmp/w10-threejs-tools
      TARGET_BRANCH: design/w10-threejs-video-texture
      PREVIEW_URL: https://what10things.co.uk/w10-threejs-preview/
    steps:
      - name: Preserve proven Claude implementation
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          test -s preview/threejs/index.html
          test -s preview/threejs/style.css
          test -s preview/threejs/src/main.js
          test -s preview/threejs/app.js
          test -s preview/threejs/media/frames/frame-096.webp
          test -s preview/threejs/media/source-flow-video.mp4
          rm -rf /tmp/w10-threejs-finish-preserve
          cp -a preview/threejs /tmp/w10-threejs-finish-preserve
          gh auth setup-git
          git fetch origin "$TARGET_BRANCH"
          git reset --hard "origin/$TARGET_BRANCH"
          rm -rf preview/threejs
          cp -a /tmp/w10-threejs-finish-preserve preview/threejs
          git config user.name 'w10-threejs-agent-test'
          git config user.email 'actions@what10things.local'

      - name: Antigravity reviews embedded source without shell tools
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          python3 "$FLOW_ROOT/bin/enforce-antigravity-overage.py"
          cat > /tmp/w10-agy-embedded.txt <<'EOF'
          You are the independent architecture reviewer. DO NOT CALL ANY TOOLS OR COMMANDS. Everything you need is embedded below. Review it directly and output only your review.

          Requirement: the existing Google Flow-generated 8-second video must remain the visual source. The 96 WebP frames are decoded directly from that exact video. The implementation must draw the selected decoded frame into the same 2D source canvas used by THREE.CanvasTexture; scrolling must advance/reverse those video-derived frames. Three.js may add restrained camera depth/nodes/orbit lines but must not replace the Flow footage. Review mobile Safari suitability, CanvasTexture correctness, memory/network strategy for 96 frames (~2.6MB), render-loop discipline, DPR, reduced-motion/Save-Data, WebGL fallback, accessibility and the original MP4 playback control. Conclude exactly VERDICT: PASS or VERDICT: REVISE.
          EOF
          printf '\n\n===== index.html =====\n' >> /tmp/w10-agy-embedded.txt
          cat preview/threejs/index.html >> /tmp/w10-agy-embedded.txt
          printf '\n\n===== style.css =====\n' >> /tmp/w10-agy-embedded.txt
          cat preview/threejs/style.css >> /tmp/w10-agy-embedded.txt
          printf '\n\n===== src/main.js =====\n' >> /tmp/w10-agy-embedded.txt
          cat preview/threejs/src/main.js >> /tmp/w10-agy-embedded.txt
          printf '\n\n===== Claude report =====\n' >> /tmp/w10-agy-embedded.txt
          cat preview/threejs/CLAUDE_THREEJS_REPORT.md >> /tmp/w10-agy-embedded.txt
          rm -f preview/threejs/ANTIGRAVITY_THREEJS_REVIEW.md
          timeout 480s "$HOME/.local/bin/agy-safe" -p "$(cat /tmp/w10-agy-embedded.txt)" --output-format text | tee preview/threejs/ANTIGRAVITY_THREEJS_REVIEW.md
          test -s preview/threejs/ANTIGRAVITY_THREEJS_REVIEW.md
          grep -Eq 'VERDICT: (PASS|REVISE)' preview/threejs/ANTIGRAVITY_THREEJS_REVIEW.md
          python3 "$FLOW_ROOT/bin/enforce-antigravity-overage.py"

      - name: Codex independently reviews and patches
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          cat > /tmp/w10-codex-threejs.txt <<'EOF'
          Independently review preview/threejs/ as a senior WebGL and mobile performance engineer. Claude built it and the first Playwright test already proved the Flow-derived canvas texture visibly changes: iPhone-simulated scroll changed frames 0 -> 71 -> 14 with distinct pixel signatures and distinct WebGL canvas screenshot hashes; desktop also passed; reduced-motion stayed static. Read index.html, style.css, src/main.js, CLAUDE_THREEJS_REPORT.md and ANTIGRAVITY_THREEJS_REVIEW.md.

          PATCH clear defects directly while preserving the non-negotiable architecture: the exact existing Flow video is represented by 96 decoded WebP frames; selected frame is drawn into a source canvas; that exact canvas drives THREE.CanvasTexture; scroll forward/reverse changes the displayed video-derived frame. Do not replace it with a synthetic scene. Do not use HTMLVideoElement seeking for scroll. Preserve the explicit original MP4 playback control, mobile Safari compatibility, reduced-motion/Save-Data, WebGL fallback, noindex, and conservative GPU/memory use. Write preview/threejs/CODEX_THREEJS_REVIEW.md ending exactly VERDICT: PASS if fit for browser QA, otherwise VERDICT: FAIL.
          EOF
          timeout 600s codex exec -C "$GITHUB_WORKSPACE" --approve-for-me "$(cat /tmp/w10-codex-threejs.txt)" | tee /tmp/w10-codex-threejs-output.txt
          test -s preview/threejs/CODEX_THREEJS_REVIEW.md
          grep -q '^VERDICT: PASS$' preview/threejs/CODEX_THREEJS_REVIEW.md
          rm -rf node_modules
          ln -s "$TOOLS/node_modules" node_modules
          "$TOOLS/node_modules/.bin/esbuild" preview/threejs/src/main.js --bundle --minify --format=iife --outfile=preview/threejs/app.js
          node --check preview/threejs/app.js

      - name: Final Playwright proves forward and reverse rendered video frames
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          pkill -f 'python3 -m http.server 8796' >/dev/null 2>&1 || true
          nohup python3 -m http.server 8796 --bind 127.0.0.1 --directory preview/threejs >/tmp/w10-threejs-final-server.log 2>&1 &
          sleep 2
          export NODE_PATH="$FLOW_ROOT/node_modules"
          cd "$FLOW_ROOT"
          node - <<'JS'
          const {chromium}=require('playwright');const crypto=require('crypto');(async()=>{const b=await chromium.launch({headless:true});for(const cfg of [{w:390,h:844,ua:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1',mobile:true,touch:true},{w:1440,h:1000}]){const p=await b.newPage({viewport:{width:cfg.w,height:cfg.h},userAgent:cfg.ua,isMobile:cfg.mobile,hasTouch:cfg.touch});const e=[];p.on('console',m=>{if(m.type()==='error')e.push(m.text())});p.on('pageerror',x=>e.push(x.message));await p.goto('http://127.0.0.1:8796/',{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>window.__W10_THREE__?.ready===true,null,{timeout:20000});const c=p.locator('#three-stage canvas');const a=await p.evaluate(()=>({f:window.__W10_THREE__.frame,s:window.__W10_THREE__.signature,src:window.__W10_THREE__.source,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+1}));const ah=crypto.createHash('sha256').update(await c.screenshot()).digest('hex');await p.evaluate(()=>scrollTo(0,(document.documentElement.scrollHeight-innerHeight)*.8));await p.waitForTimeout(1500);const f=await p.evaluate(()=>({f:window.__W10_THREE__.frame,s:window.__W10_THREE__.signature,p:window.__W10_THREE__.progress}));const fh=crypto.createHash('sha256').update(await c.screenshot()).digest('hex');await p.evaluate(()=>scrollTo(0,(document.documentElement.scrollHeight-innerHeight)*.1));await p.waitForTimeout(1500);const r=await p.evaluate(()=>({f:window.__W10_THREE__.frame,s:window.__W10_THREE__.signature,p:window.__W10_THREE__.progress}));const rh=crypto.createHash('sha256').update(await c.screenshot()).digest('hex');console.log(JSON.stringify({cfg,a,f,r,hashes:{ah,fh,rh},e}));if(a.src!=='flow-video-frames'||a.overflow||e.length||f.f<65||f.s===a.s||fh===ah||r.f>=f.f||r.s===f.s||rh===fh)process.exit(2);await p.close();}await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Commit all reviewed preview files
        shell: bash
        run: |
          set -euo pipefail
          rm -f node_modules
          git add preview/threejs
          git commit -m 'Add Three.js preview driven by generated Flow video frames'
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Deploy isolated preview
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: mainbuyer.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./preview/threejs/
          server-dir: ./w10-threejs-preview/
          state-name: .ftp-deploy-w10-threejs-preview-state.json
          dangerous-clean-slate: false

      - name: Public iPhone-style proof
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          for i in $(seq 1 15); do curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "$PREVIEW_URL?v=${GITHUB_RUN_ID}" -o /tmp/w10-three-public.html && grep -q 'W10_THREEJS_FLOW_VIDEO_PREVIEW' /tmp/w10-three-public.html && break; sleep 5; done
          grep -q 'W10_THREEJS_FLOW_VIDEO_PREVIEW' /tmp/w10-three-public.html
          curl -fsSI --max-time 25 "$PREVIEW_URL/media/source-flow-video.mp4?v=${GITHUB_RUN_ID}" | grep -Ei 'HTTP/|content-type|content-length'
          curl -fsSI --max-time 25 "$PREVIEW_URL/media/frames/frame-096.webp?v=${GITHUB_RUN_ID}" | grep -Ei 'HTTP/|content-type|content-length'
          export NODE_PATH="$FLOW_ROOT/node_modules"
          cd "$FLOW_ROOT"
          node - <<'JS'
          const {chromium}=require('playwright');(async()=>{const b=await chromium.launch({headless:true});const ua='Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1';const p=await b.newPage({viewport:{width:390,height:844},userAgent:ua,isMobile:true,hasTouch:true});const e=[];p.on('console',m=>{if(m.type()==='error')e.push(m.text())});p.on('pageerror',x=>e.push(x.message));await p.goto('https://what10things.co.uk/w10-threejs-preview/?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});await p.waitForFunction(()=>window.__W10_THREE__?.ready===true,null,{timeout:20000});const a=await p.evaluate(()=>({f:window.__W10_THREE__.frame,s:window.__W10_THREE__.signature,src:window.__W10_THREE__.source}));await p.evaluate(()=>scrollTo(0,(document.documentElement.scrollHeight-innerHeight)*.78));await p.waitForTimeout(1600);const f=await p.evaluate(()=>({f:window.__W10_THREE__.frame,s:window.__W10_THREE__.signature,p:window.__W10_THREE__.progress}));await p.evaluate(()=>scrollTo(0,(document.documentElement.scrollHeight-innerHeight)*.12));await p.waitForTimeout(1600);const r=await p.evaluate(()=>({f:window.__W10_THREE__.frame,s:window.__W10_THREE__.signature,p:window.__W10_THREE__.progress}));console.log({a,f,r,e});if(a.src!=='flow-video-frames'||f.f<60||f.s===a.s||r.f>=f.f||r.s===f.s||e.length)process.exit(2);await p.close();await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Confirm Antigravity billing guard
        if: always()
        shell: bash
        run: python3 "$FLOW_ROOT/bin/enforce-antigravity-overage.py"
