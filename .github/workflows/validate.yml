name: Validate What10Things knowledge platform

on:
  pull_request:
    paths:
      - 'flask-overlay/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/validate.yml'
      - 'automation/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-r01:
    if: github.event_name == 'pull_request' && github.head_ref == 'automation/n8n-knowledge-factory'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/n8n-knowledge-factory
          fetch-depth: 0
      - name: Tighten travel quality gates
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('automation/n8n/W10-R01-evidence-research.json')
          data=json.loads(path.read_text())
          w=data[0]
          nodes={n['name']:n for n in w['nodes']}
          p=nodes['Build evidence-grounded research prompt']['parameters']['jsCode']
          old="Prefer durable attractions over temporary events. Do not state current prices or opening hours unless the supplied evidence clearly dates them."
          new=("Use durable places and attractions only: exclude festivals, one-off events, seasonal celebrations and other date-dependent experiences from an evergreen things-to-do guide. "
               "Geography must be exact: if an item title names a city, region or island, the body and cited evidence must place the attraction in that same location. Never guess a location. "
               "Avoid wording such as currently, today, ongoing, continues today or still under construction. Do not make best/highest/largest/oldest/most-popular or similar superlative claims unless that exact claim is explicitly supported by a cited source. "
               "Do not state current prices or opening hours unless the supplied evidence clearly dates them.")
          if old in p:
              p=p.replace(old,new)
          p=p.replace('/* W10_R01_PROMPT_V5_ROUTER */','/* W10_R01_PROMPT_V6_TRAVEL_QUALITY */')
          nodes['Build evidence-grounded research prompt']['parameters']['jsCode']=p
          v=nodes['Validate ten sourced facts']['parameters']['jsCode']
          anchor="if(title.length<5||body.length<40||!ids.length)continue;"
          guard=(
              "if(title.length<5||body.length<40||!ids.length)continue;\n"
              "if(String(c.category)==='travel'){\n"
              "  const joined=(title+' '+body);\n"
              "  if(/\\b(currently|today|ongoing|continues today|still under construction)\\b/i.test(joined))continue;\n"
              "  if(String(c.intent||base.intent)==='things_to_do'&&/\\b(festival|festivities|annual event|seasonal celebration|one-off event)\\b/i.test(joined))continue;\n"
              "  const titleLoc=title.match(/\\bin\\s+([A-ZÀ-ÖØ-Þ][A-Za-zÀ-ÖØ-öø-ÿ .'-]{2,40})$/u);\n"
              "  const lead=body.slice(0,240);\n"
              "  const bodyLoc=lead.match(/\\b(?:located|situated|based|set|complex)\\s+(?:on|in|near)\\s+(?:the\\s+)?([A-ZÀ-ÖØ-Þ][A-Za-zÀ-ÖØ-öø-ÿ .'-]{2,40}?)(?=[,.;]|\\sis\\b|\\sand\\b)/u)||lead.match(/\\bin\\s+([A-ZÀ-ÖØ-Þ][A-Za-zÀ-ÖØ-öø-ÿ'-]{2,30})(?=[,.;])/u);\n"
              "  if(titleLoc&&bodyLoc){const norm=s=>String(s||'').toLowerCase().replace(/[^a-zà-öø-ÿ]+/g,' ').trim();if(norm(titleLoc[1])!==norm(bodyLoc[1]))continue;}\n"
              "  const risky=body.match(/\\b(highest|lowest|largest|smallest|oldest|newest|best|most visited|most popular)\\b/i);\n"
              "  if(risky){const needle=String(risky[1]).toLowerCase();const support=ids.map(id=>String(byId.get(id)?.content||'').toLowerCase()).join(' ');if(!support.includes(needle))continue;}\n"
              "}"
          )
          if 'W10_R01_VALIDATE_V6_TRAVEL_QUALITY' not in v:
              assert anchor in v, 'validator anchor not found'
              v=v.replace(anchor,guard,1)
          v=v.replace('/* W10_R01_VALIDATE_V5 */','/* W10_R01_VALIDATE_V6_TRAVEL_QUALITY */')
          nodes['Validate ten sourced facts']['parameters']['jsCode']=v
          path.write_text(json.dumps(data,separators=(',',':'),ensure_ascii=False)+'\n')
          check=json.loads(path.read_text())[0]
          assert check['active'] is False
          assert 'W10_R01_PROMPT_V6_TRAVEL_QUALITY' in nodes['Build evidence-grounded research prompt']['parameters']['jsCode']
          assert 'W10_R01_VALIDATE_V6_TRAVEL_QUALITY' in nodes['Validate ten sourced facts']['parameters']['jsCode']
          print('R01 travel quality patch ready')
          PY
          if git diff --quiet; then
            echo 'Patch already applied'
            exit 0
          fi
          git config user.name 'What10Things Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add automation/n8n/W10-R01-evidence-research.json
          git commit -m 'Tighten travel research quality gates'
          git push origin HEAD:automation/n8n-knowledge-factory

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate n8n workflow structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('automation/n8n').glob('*.json'))
          assert files, 'No n8n workflow files found'
          for path in files:
              data = json.loads(path.read_text())
              assert isinstance(data, list) and len(data) == 1, path
              workflow = data[0]
              assert workflow.get('active') is False, f'{path}: source workflow must be inactive'
              nodes = workflow.get('nodes') or []
              assert nodes, f'{path}: no nodes'
              names = {node.get('name') for node in nodes}
              assert len(names) == len(nodes) and None not in names, f'{path}: duplicate/missing node names'
              for node in nodes:
                  assert isinstance(node.get('position'), list) and len(node['position']) == 2, f"{path}: {node.get('name')} missing position"
                  assert isinstance(node.get('typeVersion'), (int, float)), f"{path}: {node.get('name')} missing typeVersion"
                  assert isinstance(node.get('parameters'), dict), f"{path}: {node.get('name')} missing parameters"
              for source, routes in (workflow.get('connections') or {}).items():
                  assert source in names, f'{path}: connection source {source!r} missing'
                  for outputs in routes.values():
                      for branch in outputs:
                          for edge in branch:
                              assert edge.get('node') in names, f"{path}: connection target {edge.get('node')!r} missing"
              print(f'{path}: {len(nodes)} nodes OK')
          PY
      - name: Reconstruct application under test
        run: |
          mkdir -p test_app
          cat deploy-package/part-* | base64 --decode > "${RUNNER_TEMP}/what10things-flask.zip"
          echo "563746e61d46c82c60ffa7d8fb54c4d291471d7f42c8e2f305f9c094b25af78c  ${RUNNER_TEMP}/what10things-flask.zip" | sha256sum --check --strict
          unzip -q "${RUNNER_TEMP}/what10things-flask.zip" -d test_app
          cat flask-overlay/part-* | base64 --decode > "${RUNNER_TEMP}/what10things-knowledge-overlay.zip"
          echo "eb13d90d422dfbc74f48461cfefb40b54629ced80e4d037cc8a94fa84021cc67  ${RUNNER_TEMP}/what10things-knowledge-overlay.zip" | sha256sum --check --strict
          unzip -q -o "${RUNNER_TEMP}/what10things-knowledge-overlay.zip" -d test_app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: test_app/requirements.txt
      - name: Install application requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r test_app/requirements.txt
      - name: Compile and run full validation
        run: |
          python -m compileall -q test_app
          PYTHONPATH=test_app python test_app/validate.py
