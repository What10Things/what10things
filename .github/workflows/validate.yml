name: Validate What10Things knowledge platform

on:
  pull_request:
    paths:
      - 'flask-overlay/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/validate.yml'
      - 'automation/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-r01-pool:
    if: github.event_name == 'pull_request' && github.head_ref == 'automation/n8n-knowledge-factory'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: automation/n8n-knowledge-factory
          fetch-depth: 0
      - name: Increase research candidate pool without weakening validation
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('automation/n8n/W10-R01-evidence-research.json')
          data=json.loads(path.read_text())
          w=data[0]
          nodes={n['name']:n for n in w['nodes']}
          node=nodes['Build evidence-grounded research prompt']
          code=node['parameters']['jsCode']
          if 'W10_R01_PROMPT_V7_CANDIDATE_POOL' not in code:
              code=code.replace('/* W10_R01_PROMPT_V6_TRAVEL_QUALITY */','/* W10_R01_PROMPT_V7_CANDIDATE_POOL */')
              code=code.replace('Produce exactly 10 distinct places, attractions or experiences a visitor could realistically consider.', 'Produce exactly 14 ranked candidate places, attractions or experiences a visitor could realistically consider. The validator will discard weak candidates and publish only the first 10 that pass all evidence and quality checks.')
              code=code.replace('Produce exactly 10 distinct destinations, neighbourhoods, islands, regions or attractions that are genuinely useful choices for a visitor.', 'Produce exactly 14 ranked candidate destinations, neighbourhoods, islands, regions or attractions that are genuinely useful choices for a visitor. The validator will publish only the first 10 that pass all evidence and quality checks.')
              code=code.replace('Produce exactly 10 durable planning points a visitor should understand before travelling.', 'Produce exactly 14 ranked candidate planning points a visitor should understand before travelling. The validator will publish only the first 10 that pass all evidence and quality checks.')
              code=code.replace('Produce exactly 10 interesting, durable facts about the location,', 'Produce exactly 14 ranked candidate interesting, durable facts about the location,')
              code=code.replace('items:[EXACTLY 10]', 'items:[EXACTLY 14 CANDIDATES]')
              code=code.replace('max_tokens:5000', 'max_tokens:6500')
          node['parameters']['jsCode']=code
          path.write_text(json.dumps(data,separators=(',',':'),ensure_ascii=False)+'\n')
          check=json.loads(path.read_text())[0]
          c={n['name']:n for n in check['nodes']}['Build evidence-grounded research prompt']['parameters']['jsCode']
          v={n['name']:n for n in check['nodes']}['Validate ten sourced facts']['parameters']['jsCode']
          assert 'W10_R01_PROMPT_V7_CANDIDATE_POOL' in c
          assert 'items:[EXACTLY 14 CANDIDATES]' in c
          assert 'max_tokens:6500' in c
          assert 'if(items.length>=10)break' in v
          assert 'W10_R01_VALIDATE_V6_TRAVEL_QUALITY' in v
          print('14-candidate pool ready; 10-item quality gate retained')
          PY
          if git diff --quiet; then
            echo 'Candidate-pool patch already applied'
            exit 0
          fi
          git config user.name 'What10Things Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add automation/n8n/W10-R01-evidence-research.json
          git commit -m 'Generate 14 research candidates for 10-item quality gate'
          git push origin HEAD:automation/n8n-knowledge-factory

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate n8n workflow structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path('automation/n8n').glob('*.json'))
          assert files, 'No n8n workflow files found'
          for path in files:
              data = json.loads(path.read_text())
              assert isinstance(data, list) and len(data) == 1, path
              workflow = data[0]
              assert workflow.get('active') is False, f'{path}: source workflow must be inactive'
              nodes = workflow.get('nodes') or []
              assert nodes, f'{path}: no nodes'
              names = {node.get('name') for node in nodes}
              assert len(names) == len(nodes) and None not in names, f'{path}: duplicate/missing node names'
              for node in nodes:
                  assert isinstance(node.get('position'), list) and len(node['position']) == 2, f"{path}: {node.get('name')} missing position"
                  assert isinstance(node.get('typeVersion'), (int, float)), f"{path}: {node.get('name')} missing typeVersion"
                  assert isinstance(node.get('parameters'), dict), f"{path}: {node.get('name')} missing parameters"
              for source, routes in (workflow.get('connections') or {}).items():
                  assert source in names, f'{path}: connection source {source!r} missing'
                  for outputs in routes.values():
                      for branch in outputs:
                          for edge in branch:
                              assert edge.get('node') in names, f"{path}: connection target {edge.get('node')!r} missing"
              print(f'{path}: {len(nodes)} nodes OK')
          PY
      - name: Reconstruct application under test
        run: |
          mkdir -p test_app
          cat deploy-package/part-* | base64 --decode > "${RUNNER_TEMP}/what10things-flask.zip"
          echo "563746e61d46c82c60ffa7d8fb54c4d291471d7f42c8e2f305f9c094b25af78c  ${RUNNER_TEMP}/what10things-flask.zip" | sha256sum --check --strict
          unzip -q "${RUNNER_TEMP}/what10things-flask.zip" -d test_app
          cat flask-overlay/part-* | base64 --decode > "${RUNNER_TEMP}/what10things-knowledge-overlay.zip"
          echo "eb13d90d422dfbc74f48461cfefb40b54629ced80e4d037cc8a94fa84021cc67  ${RUNNER_TEMP}/what10things-knowledge-overlay.zip" | sha256sum --check --strict
          unzip -q -o "${RUNNER_TEMP}/what10things-knowledge-overlay.zip" -d test_app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: test_app/requirements.txt
      - name: Install application requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r test_app/requirements.txt
      - name: Compile and run full validation
        run: |
          python -m compileall -q test_app
          PYTHONPATH=test_app python test_app/validate.py
