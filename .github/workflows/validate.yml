name: Validate What10Things knowledge platform

on:
  pull_request:
    paths:
      - 'flask-overlay/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/validate.yml'
      - 'automation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate n8n workflow structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path('automation/n8n').glob('*.json'))
          assert files, 'No n8n workflow files found'
          for path in files:
              data = json.loads(path.read_text())
              assert isinstance(data, list) and len(data) == 1, path
              workflow = data[0]
              assert workflow.get('active') is False, f'{path}: source workflow must be inactive'
              nodes = workflow.get('nodes') or []
              assert nodes, f'{path}: no nodes'
              names = {node.get('name') for node in nodes}
              assert len(names) == len(nodes) and None not in names, f'{path}: duplicate/missing node names'
              for node in nodes:
                  assert isinstance(node.get('position'), list) and len(node['position']) == 2, f"{path}: {node.get('name')} missing position"
                  assert isinstance(node.get('typeVersion'), (int, float)), f"{path}: {node.get('name')} missing typeVersion"
                  assert isinstance(node.get('parameters'), dict), f"{path}: {node.get('name')} missing parameters"
              for source, routes in (workflow.get('connections') or {}).items():
                  assert source in names, f'{path}: connection source {source!r} missing'
                  for outputs in routes.values():
                      for branch in outputs:
                          for edge in branch:
                              assert edge.get('node') in names, f"{path}: connection target {edge.get('node')!r} missing"
              print(f'{path}: {len(nodes)} nodes OK')
          PY
      - name: Reconstruct application under test
        run: |
          mkdir -p test_app
          cat deploy-package/part-* | base64 --decode > "${RUNNER_TEMP}/what10things-flask.zip"
          echo "563746e61d46c82c60ffa7d8fb54c4d291471d7f42c8e2f305f9c094b25af78c  ${RUNNER_TEMP}/what10things-flask.zip" | sha256sum --check --strict
          unzip -q "${RUNNER_TEMP}/what10things-flask.zip" -d test_app
          cat flask-overlay/part-* | base64 --decode > "${RUNNER_TEMP}/what10things-knowledge-overlay.zip"
          echo "eb13d90d422dfbc74f48461cfefb40b54629ced80e4d037cc8a94fa84021cc67  ${RUNNER_TEMP}/what10things-knowledge-overlay.zip" | sha256sum --check --strict
          unzip -q -o "${RUNNER_TEMP}/what10things-knowledge-overlay.zip" -d test_app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: test_app/requirements.txt
      - name: Install application requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r test_app/requirements.txt
      - name: Compile and run full validation
        run: |
          python -m compileall -q test_app
          PYTHONPATH=test_app python test_app/validate.py

  inspect-production:
    if: github.event_name == 'pull_request' && github.head_ref == 'automation/n8n-knowledge-factory'
    runs-on: self-hosted
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Locate n8n runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          N8N_CONTAINER="$(docker ps --format '{{.Names}} {{.Image}}' | awk 'tolower($0) ~ /n8n/ {print $1; exit}')"
          test -n "$N8N_CONTAINER" || { echo 'No running n8n container found'; exit 1; }
          echo "container=$N8N_CONTAINER" >> "$GITHUB_OUTPUT"
          docker exec "$N8N_CONTAINER" n8n --version
      - name: Inspect relevant n8n workflows
        shell: bash
        env:
          N8N_CONTAINER: ${{ steps.runtime.outputs.container }}
        run: |
          set -euo pipefail
          docker exec "$N8N_CONTAINER" rm -f /tmp/w10-workflows.json || true
          docker exec "$N8N_CONTAINER" n8n export:workflow --all --output=/tmp/w10-workflows.json
          docker cp "$N8N_CONTAINER:/tmp/w10-workflows.json" "$RUNNER_TEMP/n8n-workflows.json"
          python3 - <<'PY'
          import json, os
          p=os.path.join(os.environ['RUNNER_TEMP'],'n8n-workflows.json')
          data=json.load(open(p,encoding='utf-8'))
          if isinstance(data,dict): data=[data]
          wanted=[]
          for w in data:
              name=str(w.get('name',''))
              if name.startswith('W10-') or name.startswith('MB-AI01'):
                  wanted.append({'id':w.get('id'),'name':name,'active':w.get('active')})
          print(json.dumps(wanted,indent=2))
          PY
      - name: Probe live site
        shell: bash
        run: |
          set -euo pipefail
          echo '--- /api/status ---'
          curl --fail --silent --show-error --location --max-time 30 'https://what10things.co.uk/api/status' | head -c 12000
          echo
          echo '--- Spain topic/search matches ---'
          curl --fail --silent --show-error --location --max-time 30 'https://what10things.co.uk/topics' | grep -i -C 2 'spain' || true
          curl --fail --silent --show-error --location --max-time 30 'https://what10things.co.uk/search?q=Spain' | grep -i -C 3 'spain' || true
