name: Validate What10Things knowledge platform

on:
  pull_request:
    paths:
      - 'flask_app/**'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/validate.yml'
      - 'automation/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: flask_app/requirements.txt
      - name: Install application requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r flask_app/requirements.txt
      - name: Compile and run full validation
        run: |
          python -m compileall -q flask_app
          PYTHONPATH=flask_app python flask_app/validate.py
