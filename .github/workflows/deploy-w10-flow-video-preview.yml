name: Deploy W10 Flow Video Preview

on:
  push:
    branches:
      - design/w10-flow-video-scroll
    paths:
      - 'preview/video/**'
      - '.github/workflows/deploy-w10-flow-video-preview.yml'
      - '.github/scripts/w10_scroll_qa.js'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w10-flow-video-preview
  cancel-in-progress: true

jobs:
  validate-deploy-qa:
    runs-on: [self-hosted, Linux, mainbuyer-server2]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate preview bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s preview/video/index.html
          test -s preview/video/style.css
          test -s preview/video/app.js
          test -s preview/video/media/knowledge-constellation.mp4
          test -s preview/video/media/knowledge-constellation-scroll.webm
          test -s preview/video/media/frames/frame-001.webp
          test -s preview/video/media/frames/frame-096.webp
          grep -q 'W10_FLOW_VIDEO_SCROLL_PREVIEW' preview/video/index.html
          grep -q 'noindex,nofollow,noarchive' preview/video/index.html
          grep -q "mode === 'frames'" preview/video/app.js
          grep -q 'prefers-reduced-motion' preview/video/style.css
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          node --check preview/video/app.js
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 preview/video/media/knowledge-constellation.mp4

      - name: Deploy isolated preview
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: mainbuyer.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./preview/video/
          server-dir: ./w10-video-preview/
          state-name: .ftp-deploy-w10-video-preview-state.json
          dangerous-clean-slate: false

      - name: Verify public preview files
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            if curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://what10things.co.uk/w10-video-preview/?v=${GITHUB_SHA}" -o /tmp/w10-public.html && grep -q 'W10_FLOW_VIDEO_SCROLL_PREVIEW' /tmp/w10-public.html; then
              grep -q 'noindex,nofollow,noarchive' /tmp/w10-public.html
              curl -fsSI --max-time 25 "https://what10things.co.uk/w10-video-preview/media/frames/frame-001.webp?v=${GITHUB_SHA}" | grep -Ei 'HTTP/|content-type|content-length'
              echo 'PREVIEW_URL=https://what10things.co.uk/w10-video-preview/'
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Browser QA desktop video iPhone frames and reduced motion
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          export NODE_PATH="$HOME/agents/flow-browser-automation/node_modules"
          node .github/scripts/w10_scroll_qa.js https://what10things.co.uk/w10-video-preview/
