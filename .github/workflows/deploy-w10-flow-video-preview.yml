name: Deploy W10 Flow Video Preview

on:
  push:
    branches:
      - design/w10-flow-video-scroll
    paths:
      - 'preview/video/**'
      - '.github/workflows/deploy-w10-flow-video-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w10-flow-video-preview
  cancel-in-progress: true

jobs:
  validate-deploy-qa:
    runs-on: [self-hosted, Linux, mainbuyer-server2]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate preview bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s preview/video/index.html
          test -s preview/video/style.css
          test -s preview/video/app.js
          test -s preview/video/media/knowledge-constellation.mp4
          grep -q 'W10_FLOW_VIDEO_SCROLL_PREVIEW' preview/video/index.html
          grep -q 'noindex,nofollow,noarchive' preview/video/index.html
          grep -q 'knowledge-constellation.mp4' preview/video/index.html
          grep -q 'prefers-reduced-motion' preview/video/style.css
          node --check preview/video/app.js
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,width,height -of default=noprint_wrappers=1 preview/video/media/knowledge-constellation.mp4

      - name: Deploy isolated preview
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: mainbuyer.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./preview/video/
          server-dir: ./w10-video-preview/
          state-name: .ftp-deploy-w10-video-preview-state.json
          dangerous-clean-slate: false

      - name: Verify public preview
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 15); do
            body=$(curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "https://what10things.co.uk/w10-video-preview/?v=${GITHUB_SHA}" || true)
            if printf '%s' "$body" | grep -q 'W10_FLOW_VIDEO_SCROLL_PREVIEW'; then
              printf '%s' "$body" | grep -q 'noindex,nofollow,noarchive'
              curl -fsSI --max-time 25 "https://what10things.co.uk/w10-video-preview/media/knowledge-constellation.mp4?v=${GITHUB_SHA}" | grep -Ei 'HTTP/|content-type|content-length'
              echo 'PREVIEW_URL=https://what10things.co.uk/w10-video-preview/'
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Browser QA mobile, desktop and reduced motion
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          ROOT="$HOME/agents/flow-browser-automation"
          cd "$ROOT"
          node - <<'JS'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            for(const [width,height] of [[390,844],[1440,1000]]){
              const page=await browser.newPage({viewport:{width,height}});
              const errors=[];
              page.on('console',m=>{if(m.type()==='error') errors.push(m.text())});
              page.on('pageerror',e=>errors.push(e.message));
              await page.goto('https://what10things.co.uk/w10-video-preview/?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(1800);
              const initial=await page.evaluate(()=>({
                marker:document.documentElement.innerHTML.includes('W10_FLOW_VIDEO_SCROLL_PREVIEW'),
                noindex:(document.querySelector('meta[name="robots"]')?.content||'').includes('noindex'),
                video:!!document.querySelector('#scrollVideo'),
                ready:document.querySelector('#scrollVideo')?.readyState||0,
                duration:document.querySelector('#scrollVideo')?.duration||0,
                overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+1
              }));
              await page.evaluate(()=>window.scrollTo(0,document.documentElement.scrollHeight*.65));
              await page.waitForTimeout(1200);
              const after=await page.evaluate(()=>({time:document.querySelector('#scrollVideo')?.currentTime||0,progress:window.__W10_SCROLL_PROGRESS__||0}));
              console.log({width,initial,after,errors});
              if(!initial.marker||!initial.noindex||!initial.video||initial.ready<1||initial.duration<=0||initial.overflow||errors.length||after.progress<0.3||after.time<=0) process.exit(2);
              await page.close();
            }
            const reduced=await browser.newPage({viewport:{width:390,height:844},reducedMotion:'reduce'});
            await reduced.goto('https://what10things.co.uk/w10-video-preview/?rm='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
            await reduced.waitForTimeout(700);
            const rm=await reduced.evaluate(()=>({matches:matchMedia('(prefers-reduced-motion: reduce)').matches,videoDisplay:getComputedStyle(document.querySelector('#scrollVideo')).display,posterDisplay:getComputedStyle(document.querySelector('.motion-fallback')).display}));
            console.log({reducedMotion:rm});
            if(!rm.matches||rm.posterDisplay==='none') process.exit(3);
            await reduced.close();
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
