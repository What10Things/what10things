name: Recover Three.js Flow Video Preview

on:
  push:
    branches: [design/w10-threejs-video-texture]
    paths: ['.github/workflows/recover-threejs-flow-video-preview.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: w10-threejs-flow-video-recovery
  cancel-in-progress: true

jobs:
  recover-review-test-deploy:
    runs-on: [self-hosted, Linux, mainbuyer-server2]
    timeout-minutes: 30
    env:
      FLOW_ROOT: /home/ubuntu/agents/flow-browser-automation
      PREVIEW_URL: https://what10things.co.uk/w10-threejs-preview/
      TOOLS: /tmp/w10-threejs-tools
      TARGET_BRANCH: design/w10-threejs-video-texture
    steps:
      - name: Preserve Claude output before touching git
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          test -s preview/threejs/index.html
          test -s preview/threejs/style.css
          test -s preview/threejs/src/main.js
          test -s preview/threejs/CLAUDE_THREEJS_REPORT.md
          test -s preview/threejs/media/source-flow-video.mp4
          test -s preview/threejs/media/frames/frame-096.webp
          rm -rf /tmp/w10-threejs-preserved
          cp -a preview/threejs /tmp/w10-threejs-preserved
          echo 'CLAUDE_OUTPUT_PRESERVED=yes'

      - name: Sync branch without cleaning preserved preview
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          gh auth setup-git
          git fetch origin "$TARGET_BRANCH"
          git reset --hard "origin/$TARGET_BRANCH"
          rm -rf preview/threejs
          cp -a /tmp/w10-threejs-preserved preview/threejs
          git config user.name 'w10-threejs-agent-test'
          git config user.email 'actions@what10things.local'

      - name: Bundle with local Three.js dependency
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          test -x "$TOOLS/node_modules/.bin/esbuild"
          test -d "$TOOLS/node_modules/three"
          rm -rf node_modules
          ln -s "$TOOLS/node_modules" node_modules
          "$TOOLS/node_modules/.bin/esbuild" preview/threejs/src/main.js --bundle --minify --format=iife --outfile=preview/threejs/app.js
          node --check preview/threejs/app.js
          grep -q 'W10_THREEJS_FLOW_VIDEO_PREVIEW' preview/threejs/index.html
          grep -q 'source-flow-video.mp4' preview/threejs/index.html

      - name: First Playwright proof of actual video-frame texture changes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          pkill -f 'python3 -m http.server 8796' >/dev/null 2>&1 || true
          nohup python3 -m http.server 8796 --bind 127.0.0.1 --directory preview/threejs >/tmp/w10-threejs-server.log 2>&1 &
          sleep 2
          curl -fsS http://127.0.0.1:8796/ | grep -q 'W10_THREEJS_FLOW_VIDEO_PREVIEW'
          export NODE_PATH="$FLOW_ROOT/node_modules"
          cd "$FLOW_ROOT"
          node - <<'JS'
          const {chromium}=require('playwright'); const crypto=require('crypto');
          (async()=>{const b=await chromium.launch({headless:true});
            for(const cfg of [{w:390,h:844,ua:'Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1',mobile:true,touch:true},{w:1440,h:1000}]){
              const p=await b.newPage({viewport:{width:cfg.w,height:cfg.h},userAgent:cfg.ua,isMobile:cfg.mobile,hasTouch:cfg.touch});const errs=[];p.on('console',m=>{if(m.type()==='error')errs.push(m.text())});p.on('pageerror',e=>errs.push(e.message));await p.goto('http://127.0.0.1:8796/',{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>window.__W10_THREE__?.ready===true,null,{timeout:20000});const c=p.locator('#three-stage canvas');const a=await p.evaluate(()=>({f:window.__W10_THREE__.frame,s:window.__W10_THREE__.signature,src:window.__W10_THREE__.source,mode:window.__W10_THREE__.mode,webgl:window.__W10_THREE__.webgl,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth+1}));const ah=crypto.createHash('sha256').update(await c.screenshot()).digest('hex');await p.evaluate(()=>scrollTo(0,(document.documentElement.scrollHeight-innerHeight)*.75));await p.waitForTimeout(1400);const f=await p.evaluate(()=>({f:window.__W10_THREE__.frame,s:window.__W10_THREE__.signature,p:window.__W10_THREE__.progress}));const fh=crypto.createHash('sha256').update(await c.screenshot()).digest('hex');await p.evaluate(()=>scrollTo(0,(document.documentElement.scrollHeight-innerHeight)*.15));await p.waitForTimeout(1400);const r=await p.evaluate(()=>({f:window.__W10_THREE__.frame,s:window.__W10_THREE__.signature,p:window.__W10_THREE__.progress}));const rh=crypto.createHash('sha256').update(await c.screenshot()).digest('hex');console.log(JSON.stringify({cfg,a,f,r,hashes:{ah,fh,rh},errs}));if(a.src!=='flow-video-frames'||!a.webgl||a.overflow||errs.length||f.f<58||f.s===a.s||fh===ah||r.f>=f.f||r.s===f.s||rh===fh)process.exit(2);await p.close();}
            const rm=await b.newPage({viewport:{width:390,height:844},reducedMotion:'reduce'});await rm.goto('http://127.0.0.1:8796/',{waitUntil:'domcontentloaded'});await rm.waitForTimeout(700);const s=await rm.evaluate(()=>({mode:window.__W10_THREE__?.mode,frame:window.__W10_THREE__?.frame,rm:matchMedia('(prefers-reduced-motion: reduce)').matches}));console.log({reduced:s});if(!s.rm||s.mode!=='static'||s.frame!==0)process.exit(3);await rm.close();await b.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Antigravity independently reviews Claude architecture
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          python3 "$FLOW_ROOT/bin/enforce-antigravity-overage.py"
          cd "$GITHUB_WORKSPACE"
          timeout 480s "$HOME/.local/bin/agy-safe" -p "Independently review preview/threejs/index.html, style.css, src/main.js and CLAUDE_THREEJS_REPORT.md. The hard requirement is that the exact existing Flow-generated video remains the visible source: 96 decoded frames from that video are drawn into the same source canvas used by THREE.CanvasTexture, and scroll drives those frames forward/reverse. Three.js may add restrained depth around the footage but must not replace it. Review CanvasTexture correctness, mobile Safari suitability, preloading/memory for 96 frames (~2.6MB), render-loop discipline, DPR, reduced-motion/Save-Data, WebGL fallback, accessibility and the original-video playback control. Do not modify files, do not use Flow, do not change billing. Output a concise review ending exactly VERDICT: PASS or VERDICT: REVISE." --output-format text | tee preview/threejs/ANTIGRAVITY_THREEJS_REVIEW.md
          test -s preview/threejs/ANTIGRAVITY_THREEJS_REVIEW.md
          grep -Eq 'VERDICT: (PASS|REVISE)' preview/threejs/ANTIGRAVITY_THREEJS_REVIEW.md
          python3 "$FLOW_ROOT/bin/enforce-antigravity-overage.py"

      - name: Codex independently reviews and patches
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          cat > /tmp/w10-codex-threejs.txt <<'EOF'
          Review preview/threejs/ as a senior WebGL and mobile performance engineer. Claude built it; Antigravity independently reviewed it. Read index.html, style.css, src/main.js, CLAUDE_THREEJS_REPORT.md and ANTIGRAVITY_THREEJS_REVIEW.md. PATCH clear defects directly but preserve the architecture: the exact existing Flow video is represented by 96 decoded WebP frames; selected frame is drawn into a source canvas; that exact canvas drives THREE.CanvasTexture; scroll forward/reverse changes the displayed video-derived frame. Do not replace this with a synthetic scene and do not use HTMLVideoElement seeking for the scroll path. Preserve original-video playback control, mobile Safari compatibility, reduced-motion/Save-Data, WebGL fallback, noindex and conservative GPU/memory use. Write preview/threejs/CODEX_THREEJS_REVIEW.md ending exactly VERDICT: PASS if fit for browser QA, otherwise VERDICT: FAIL.
          EOF
          timeout 600s codex exec -C "$GITHUB_WORKSPACE" --approve-for-me "$(cat /tmp/w10-codex-threejs.txt)" | tee /tmp/w10-codex-threejs-output.txt
          test -s preview/threejs/CODEX_THREEJS_REVIEW.md
          grep -q '^VERDICT: PASS$' preview/threejs/CODEX_THREEJS_REVIEW.md
          "$TOOLS/node_modules/.bin/esbuild" preview/threejs/src/main.js --bundle --minify --format=iife --outfile=preview/threejs/app.js
          node --check preview/threejs/app.js

      - name: Final local browser QA after all three agents
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          export NODE_PATH="$FLOW_ROOT/node_modules"
          cd "$FLOW_ROOT"
          node - <<'JS'
          const {chromium}=require('playwright');(async()=>{const b=await chromium.launch({headless:true});for(const [w,h] of [[390,844],[1440,1000]]){const p=await b.newPage({viewport:{width:w,height:h}});const e=[];p.on('console',m=>{if(m.type()==='error')e.push(m.text())});p.on('pageerror',x=>e.push(x.message));await p.goto('http://127.0.0.1:8796/',{waitUntil:'domcontentloaded'});await p.waitForFunction(()=>window.__W10_THREE__?.ready);const a=await p.evaluate(()=>({f:window.__W10_THREE__.frame,s:window.__W10_THREE__.signature,src:window.__W10_THREE__.source}));await p.evaluate(()=>scrollTo(0,(document.documentElement.scrollHeight-innerHeight)*.8));await p.waitForTimeout(1400);const f=await p.evaluate(()=>({f:window.__W10_THREE__.frame,s:window.__W10_THREE__.signature,p:window.__W10_THREE__.progress}));await p.evaluate(()=>scrollTo(0,(document.documentElement.scrollHeight-innerHeight)*.1));await p.waitForTimeout(1400);const r=await p.evaluate(()=>({f:window.__W10_THREE__.frame,s:window.__W10_THREE__.signature,p:window.__W10_THREE__.progress}));console.log({w,a,f,r,e});if(a.src!=='flow-video-frames'||f.f<65||f.s===a.s||r.f>=f.f||r.s===f.s||e.length)process.exit(2);await p.close();}await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Commit reviewed preview to isolated branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f node_modules
          git add preview/threejs
          git commit -m 'Add reviewed Three.js surface driven by Flow video frames'
          git push origin HEAD:"$TARGET_BRANCH"

      - name: Deploy isolated Three.js preview
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: mainbuyer.com
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./preview/threejs/
          server-dir: ./w10-threejs-preview/
          state-name: .ftp-deploy-w10-threejs-preview-state.json
          dangerous-clean-slate: false

      - name: Public iPhone-style browser proof
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/node24/bin:$HOME/.local/bin:$PATH"
          for i in $(seq 1 12); do curl -fsSL --max-time 25 -H 'Cache-Control: no-cache' "$PREVIEW_URL?v=${GITHUB_RUN_ID}" -o /tmp/w10-three-public.html && grep -q 'W10_THREEJS_FLOW_VIDEO_PREVIEW' /tmp/w10-three-public.html && break; sleep 5; done
          grep -q 'W10_THREEJS_FLOW_VIDEO_PREVIEW' /tmp/w10-three-public.html
          curl -fsSI --max-time 25 "$PREVIEW_URL/media/frames/frame-096.webp?v=${GITHUB_RUN_ID}" | grep -Ei 'HTTP/|content-type|content-length'
          export NODE_PATH="$FLOW_ROOT/node_modules"
          cd "$FLOW_ROOT"
          node - <<'JS'
          const {chromium}=require('playwright');(async()=>{const b=await chromium.launch({headless:true});const ua='Mozilla/5.0 (iPhone; CPU iPhone OS 18_6 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.6 Mobile/15E148 Safari/604.1';const p=await b.newPage({viewport:{width:390,height:844},userAgent:ua,isMobile:true,hasTouch:true});const e=[];p.on('console',m=>{if(m.type()==='error')e.push(m.text())});p.on('pageerror',x=>e.push(x.message));await p.goto('https://what10things.co.uk/w10-threejs-preview/?qa='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});await p.waitForFunction(()=>window.__W10_THREE__?.ready===true,null,{timeout:20000});const a=await p.evaluate(()=>({f:window.__W10_THREE__.frame,s:window.__W10_THREE__.signature,src:window.__W10_THREE__.source}));await p.evaluate(()=>scrollTo(0,(document.documentElement.scrollHeight-innerHeight)*.75));await p.waitForTimeout(1500);const f=await p.evaluate(()=>({f:window.__W10_THREE__.frame,s:window.__W10_THREE__.signature,p:window.__W10_THREE__.progress}));console.log({a,f,e});if(a.src!=='flow-video-frames'||f.f<58||f.s===a.s||e.length)process.exit(2);await p.close();await b.close();})().catch(e=>{console.error(e);process.exit(1)});
          JS

      - name: Confirm billing guard
        if: always()
        shell: bash
        run: python3 "$FLOW_ROOT/bin/enforce-antigravity-overage.py"
